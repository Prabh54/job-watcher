name: fitcheck
# One-off: re-scores a sample of recent jobs with the current CANDIDATE_PROFILE secret.
# Runs only on a push to the fitcheck branch. Delete after the check.
on:
  push:
    branches: [fitcheck]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python fitcheck.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CANDIDATE_PROFILE: ${{ secrets.CANDIDATE_PROFILE }}
          DRY_RUN: "1"
