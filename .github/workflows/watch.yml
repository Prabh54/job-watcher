name: job-watcher

on:
  schedule:
    - cron: "7 * * * *"      # every hour at :07 (UTC); GitHub may start it a few minutes late
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write             # needed to save data/ back to the repo

concurrency:
  group: job-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Check for new jobs
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python watcher.py

      - name: Save state
        if: always()
        run: |
          git config user.name "job-watcher-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "nothing to save"; exit 0; fi
          git commit -q -m "watcher run $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1

      - name: Alert if the run itself broke
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -s -H "Title: Job watcher run failed" -H "Priority: 5" -H "Tags: rotating_light" \
            -H "Click: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "The GitHub Actions run failed. Tap to see the log." "https://ntfy.sh/$NTFY_TOPIC"
