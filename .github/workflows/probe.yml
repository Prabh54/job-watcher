name: probe-targets

# Manual only. Checks which careers feeds work for the target companies and saves the result
# to the `probe` branch. Sends no notifications and never touches data/ on main.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python probe_targets.py
      - name: Save result to the probe branch
        run: |
          git config user.name "job-watcher-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mv probe_result.json /tmp/probe_result.json
          git checkout -q --orphan probe
          git rm -rq --cached . && git clean -fdq
          mv /tmp/probe_result.json .
          git add probe_result.json
          git commit -qm "probe $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf origin probe
