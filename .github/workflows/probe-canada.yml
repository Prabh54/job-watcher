name: probe-canada

# Manual only. Diagnoses the low Canadian job count and tests new Canadian sources
# (see probe_canada.py). Saves probe_canada.json to the `probe-canada` branch.
# Sends no notifications and never touches data/ on main.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python probe_canada.py
      - name: Save result to the probe-canada branch
        if: always()
        run: |
          git config user.name "job-watcher-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mv probe_canada.json /tmp/probe_canada.json
          git checkout -q --orphan probe-canada
          git rm -rq --cached . && git clean -fdq
          mv /tmp/probe_canada.json .
          git add probe_canada.json
          git commit -qm "probe-canada $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf origin probe-canada
